<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tidy-Desktop</title>
    <link rel="stylesheet" href="postit.css">
</head>
<body>
    <div class="postit" id="postit">
        <div class="postit-header" id="drag-handle">
            <div class="color-dots" id="color-dots">
                <button class="arrow" id="up-arrow">▲</button>
                <span class="dot" data-col="0"></span>
                <span class="dot" data-col="1"></span>
                <span class="dot" data-col="2"></span>
                <span class="dot" data-col="3"></span>
                <span class="dot" data-col="4"></span>
                <button class="arrow" id="down-arrow">▼</button>
            </div>
            <div class="header-buttons">
                <button class="add-btn" id="add-btn">+</button>
                <button class="close-btn" id="close-btn">✕</button>
            </div>
        </div>
        <textarea class="postit-text" id="postit-text" placeholder="Write here..."></textarea>
    </div>
    <script src="postit.js"></script>
</body>
</html>
